name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A3FC0F: ${{ secrets.A3FC0F }}
          B64A24: ${{ secrets.B64A24 }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A3FC0F', '')
          sec_b = os.environ.get('B64A24', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- e79334f3d17a89688f944c35f41e5b22c22ffd26 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- 0da6719db0a97a2fb55f815fb205966f5a8ae15a -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
